default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite
repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.12.0
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.1
  hooks:
    - id: ruff-check
      types_or: [ python, pyi, pyproject]
      args: [ --fix ]
    - id: ruff-format
      types_or: [ python, pyi, pyproject ]
